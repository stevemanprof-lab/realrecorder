<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Voice Trainer - English Pronunciation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;background:#eef5f2;padding:12px;min-height:100vh;}
  .container{max-width:800px;margin:0 auto;}
  
  .header{background:#0d6e6e;color:white;padding:16px 20px;border-radius:24px;margin-bottom:16px;text-align:center;}
  .header h1{font-size:1.3rem;}
  .header p{font-size:0.8rem;margin-top:5px;opacity:0.9;}
  
  .home-screen{background:white;border-radius:24px;padding:20px;}
  .home-screen h2{color:#0d6e6e;margin-bottom:15px;text-align:center;font-size:1.2rem;}
  .text-grid{display:flex;flex-direction:column;gap:10px;}
  .text-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:15px;cursor:pointer;transition:all 0.2s;}
  .text-card:active{background:#e6f4f1;transform:scale(0.98);}
  .text-card h3{color:#0d6e6e;margin-bottom:5px;font-size:1rem;}
  .text-card p{font-size:0.75rem;color:#64748b;}
  
  .practice-screen{display:none;}
  .back-btn{background:#e2e8f0;color:#1e293b;margin-bottom:12px;padding:10px 16px;font-size:0.9rem;width:100%;}
  
  .card{background:white;border-radius:24px;padding:16px;margin-bottom:16px;}
  .text-header{margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;}
  .text-header h3{color:#0d6e6e;font-size:1rem;}
  
  .sentence-box{background:#e6f4f1;border-left:4px solid #0d6e6e;padding:16px;border-radius:16px;margin-bottom:16px;}
  .sentence-text{font-size:1rem;font-weight:500;line-height:1.4;color:#1a2e2a;word-break:break-word;}
  
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;justify-content:center;}
  button{background:#0d6e6e;border:none;padding:12px 20px;border-radius:40px;color:white;font-weight:600;font-size:0.85rem;cursor:pointer;min-width:100px;}
  button:active{transform:scale(0.96);background:#0a5555;}
  button.outline{background:transparent;border:2px solid #0d6e6e;color:#0d6e6e;}
  button.danger{background:#e74c3c;}
  button.success{background:#27ae60;}
  button:disabled{opacity:0.5;transform:none;}
  
  .visualizer{background:#1a1a2e;border-radius:20px;padding:15px;margin:12px 0;text-align:center;}
  canvas{width:100%;height:60px;background:#0f0f1a;border-radius:12px;}
  .status{margin-top:8px;font-size:0.8rem;font-weight:500;}
  .status.listening{color:#e74c3c;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
  
  .progress-bar{height:8px;background:#e0e0e0;border-radius:10px;margin:12px 0;}
  .progress-fill{height:100%;background:#0d6e6e;width:0%;border-radius:10px;transition:width 0.3s;}
  .progress-stats{display:flex;justify-content:space-between;font-size:0.7rem;margin-top:5px;}
  
  .feedback{margin-top:12px;padding:12px;border-radius:16px;font-size:0.85rem;line-height:1.4;}
  .feedback-success{background:#d4edda;border-left:4px solid #27ae60;color:#155724;}
  .feedback-error{background:#f8d7da;border-left:4px solid #e74c3c;color:#721c24;}
  .feedback-warning{background:#fff3cd;border-left:4px solid #f5a623;color:#856404;}
  .feedback-info{background:#d1ecf1;border-left:4px solid #0d6e6e;color:#0c5460;}
  
  .mic-status{background:#e8f5e9;border-radius:12px;padding:8px;margin-bottom:12px;text-align:center;font-size:0.75rem;color:#2e7d32;}
  .mic-status.error{background:#ffebee;color:#c62828;}
  
  @media(min-width:600px){
    body{padding:20px;}
    .text-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎤 Voice Trainer</h1>
    <p>Écoutez → Appuyez sur Parler → Répétez</p>
  </div>

  <div id="homeScreen" class="home-screen">
    <h2>📚 Choisissez un texte</h2>
    <div class="text-grid" id="textGrid"></div>
  </div>

  <div id="practiceScreen" class="practice-screen">
    <button id="backToHomeBtn" class="back-btn">← Retour</button>
    <div class="card">
      <div id="textHeader" class="text-header"></div>
      
      <div id="micStatus" class="mic-status">🎤 Appuyez sur "Parler" pour activer le micro</div>
      
      <div class="controls">
        <button id="playBtn">🔊 Écouter</button>
        <button id="repeatBtn" style="background:#f5a623;">🎤 Parler</button>
        <button id="nextBtn" class="outline" disabled>⏩ Suivant</button>
        <button id="resetBtn" class="danger">🔄 Reset</button>
      </div>

      <div class="sentence-box">
        <div class="sentence-text" id="sentenceText">Chargement...</div>
      </div>

      <div class="visualizer">
        <canvas id="voiceCanvas" width="400" height="60"></canvas>
        <div class="status" id="voiceStatus">⚪ Prêt</div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-stats">
        <span>Progression</span>
        <span id="progressText">0%</span>
      </div>

      <div id="feedback" class="feedback feedback-info">💡 Appuyez sur "Parler" puis répétez la phrase</div>
    </div>
  </div>
</div>

<script>
  // ========== TEXTES COMPLETS (originaux) ==========
  const textsData = {
    entrepreneurship: {
      title: "ENTREPRENEURSHIP",
      fullText: `Entrepreneurship is the ability and readiness to develop, organize and run a business enterprise, along with any of its uncertainties in order to make a profit. The most prominent example of entrepreneurship is the starting of new businesses. In economics, entrepreneurship connected with land, labour, natural resources and capital can generate a profit. The entrepreneurial vision is defined by discovery and risk-taking and is an indispensable part of a nation's capacity to succeed in an ever-changing and more competitive global marketplace. Entrepreneurship can be classified into small business, scalable startup, large company, and social entrepreneurship.`
    },
    fitness: {
      title: "THE IMPORTANCE OF PHYSICAL FITNESS",
      fullText: `Physical activity and exercise is important for everyone. Children, adolescents, and adults of all ages need regular physical activity. Physical activity promotes good health and you should stay active throughout all stages of your life. Regular physical activity increases life expectancy and reduces the risk of premature mortality. People who are more active tend to be healthier and tend to live longer. Regular exercise increases muscle strength, bone density, flexibility, and stability. Physical fitness can reduce your risk for accidental injuries, especially as you get older. A sedentary lifestyle can take a toll on a person's body. Exercise has been shown to improve mood and mental health.`
    },
    exports: {
      title: "EXPORTS AND IMPORTS",
      fullText: `Exports and imports play an important role in determining the overall health of an economy. Exports are goods and services a country sells to businesses or customers in a foreign country. Imports are goods and services a business or customer purchases from another country. Most countries try to export more than they import to increase domestic revenue. Exports and imports make up a country's balance of trade, which impacts an economy's overall health. A trade surplus occurs when exports are greater than imports. A trade deficit occurs when imports are greater than exports.`
    },
    ai: {
      title: "ARTIFICIAL INTELLIGENCE",
      fullText: `Artificial intelligence is a rapidly evolving technology. It has the potential to transform society across all sectors of industries and governments. AI is a field of computer science focused on creating machines that perform tasks requiring human intelligence. AI has been used in medical diagnosis, autonomous cars, home automation, social media, chatbots, virtual assistance, and financial analysis. AI can increase economic growth through improved productivity. On the other hand, AI can lead to job displacement and increase economic inequality. The ethical implications of AI include issues of bias, privacy, security, and accountability.`
    },
    malaria: {
      title: "MALARIA",
      fullText: `Malaria is caused by a parasite of the genus plasmodium which is transmitted to humans through the bites of infected female Anopheles mosquitoes. There are several types of plasmodium parasites that cause different symptoms. The symptoms of malaria appear 9 to 30 days after infection. For the most common species, the incubation period is usually 9 to 14 days. Malaria can be simple or complicated. Simple malaria manifests as a flu-like illness with fever, headache, chills, and muscle pain. Complicated malaria occurs when the parasite reaches a vital organ. Prevention is essential in the fight against malaria. It includes sanitation of wetlands, spraying mosquito repellents, and protecting homes with mosquito nets.`
    },
    deforestation: {
      title: "DEFORESTATION",
      fullText: `Deforestation is the removal and destruction of a forest or stand of trees from land that is then converted to non-forest use. About 31 percent of Earth's land surface is covered by forests at present. The causes of deforestation are complex, often interwoven with economic, social, and political factors. One primary driver is agricultural expansion, where forests are cleared for crops and livestock. Another factor is logging, both legal and illegal. The timber industry provides jobs and resources, but unsustainable logging leads to severe ecological damage. Forests act as carbon sinks. When they are destroyed, carbon is released and the capacity for future carbon absorption is diminished. Reforestation involves planting trees in areas where forests have been cut down.`
    }
  };

  // Découpage en phrases (max 100 caractères pour meilleure reconnaissance)
  function splitIntoSentences(text, maxLen=100) {
    let sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    let result = [];
    for (let s of sentences) {
      s = s.trim();
      if (s.length <= maxLen) {
        result.push(s);
      } else {
        let words = s.split(' ');
        let current = '';
        for (let w of words) {
          if ((current + ' ' + w).length <= maxLen) {
            current = current ? current + ' ' + w : w;
          } else {
            if (current) result.push(current + '.');
            current = w;
          }
        }
        if (current) result.push(current + '.');
      }
    }
    return result;
  }

  let currentTextId = null;
  let sentences = [];
  let currentIndex = 0;
  let progress = [];
  let isListening = false;
  let animationId = null;
  let recognition = null;
  let canvas = document.getElementById('voiceCanvas');
  let ctx = canvas.getContext('2d');

  // Éléments DOM
  const homeScreen = document.getElementById('homeScreen');
  const practiceScreen = document.getElementById('practiceScreen');
  const textGrid = document.getElementById('textGrid');
  const backToHomeBtn = document.getElementById('backToHomeBtn');
  const textHeader = document.getElementById('textHeader');
  const sentenceEl = document.getElementById('sentenceText');
  const playBtn = document.getElementById('playBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceStatus = document.getElementById('voiceStatus');
  const feedbackDiv = document.getElementById('feedback');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const micStatus = document.getElementById('micStatus');

  function resizeCanvas() {
    canvas.width = Math.min(canvas.parentElement.clientWidth - 30, 400);
    canvas.height = 60;
  }
  window.addEventListener('resize', resizeCanvas);

  // Progression
  function getStorageKey() { return `voice_progress_${currentTextId}`; }
  
  function loadProgress() {
    let saved = localStorage.getItem(getStorageKey());
    if (saved) progress = JSON.parse(saved);
    else progress = new Array(sentences.length).fill(false);
    while (progress.length < sentences.length) progress.push(false);
    currentIndex = 0;
    updateUI();
  }
  
  function saveProgress() {
    localStorage.setItem(getStorageKey(), JSON.stringify(progress));
    updateUI();
  }
  
  function updateUI() {
    let done = progress.filter(v=>v===true).length;
    let percent = Math.round((done/sentences.length)*100);
    progressFill.style.width = percent+'%';
    progressText.innerText = `${done}/${sentences.length} (${percent}%)`;
    sentenceEl.innerText = sentences[currentIndex];
    nextBtn.disabled = !progress[currentIndex];
    if (progress[currentIndex]) nextBtn.classList.add('success');
    else nextBtn.classList.remove('success');
  }
  
  function markCurrentDone() {
    if (!progress[currentIndex]) {
      progress[currentIndex] = true;
      saveProgress();
      showFeedback(`✅ Phrase ${currentIndex+1} validée !`, 'success');
      return true;
    }
    return false;
  }

  function showFeedback(msg, type='info') {
    let className = '';
    if (type === 'success') className = 'feedback-success';
    else if (type === 'error') className = 'feedback-error';
    else if (type === 'warning') className = 'feedback-warning';
    else className = 'feedback-info';
    
    feedbackDiv.innerHTML = msg;
    feedbackDiv.className = `feedback ${className}`;
    setTimeout(() => {
      if (feedbackDiv.innerHTML === msg) {
        feedbackDiv.innerHTML = '💡 Appuyez sur "Parler" pour continuer';
        feedbackDiv.className = 'feedback feedback-info';
      }
    }, 4000);
  }

  // Lecture audio (nécessite une interaction utilisateur)
  function speak(text, onEnd) {
    if (!window.speechSynthesis) {
      showFeedback("Lecture non disponible sur ce navigateur", "error");
      return;
    }
    let utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.onend = () => { if(onEnd) onEnd(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  function playCurrent() {
    speak(sentences[currentIndex]);
    showFeedback(`🔊 Écoute - ${currentIndex+1}/${sentences.length}`, 'info');
  }

  function playBeep() {
    try {
      let ac = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ac.createOscillator();
      let gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.1;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + 0.3);
      osc.stop(ac.currentTime + 0.3);
      setTimeout(() => ac.close(), 400);
    } catch(e) {}
  }

  // Animation de visualisation
  function startVisualization() {
    if (animationId) cancelAnimationFrame(animationId);
    let time = 0;
    function draw() {
      if (!isListening) {
        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.strokeStyle = '#0d6e6e';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width; x += 5) {
        let y = canvas.height/2 + Math.sin(x * 0.03 + time) * 15;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      time += 0.1;
      animationId = requestAnimationFrame(draw);
    }
    draw();
  }

  function stopVisualization() {
    isListening = false;
    if (animationId) cancelAnimationFrame(animationId);
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Calcul de similarité
  function calculateSimilarity(spoken, target) {
    let a = spoken.toLowerCase().replace(/[^\w\s]/g, '').trim();
    let b = target.toLowerCase().replace(/[^\w\s]/g, '').trim();
    if (a === b) return 1;
    if (a.length === 0 || b.length === 0) return 0;
    let wordsA = a.split(/\s+/);
    let wordsB = b.split(/\s+/);
    let matches = 0;
    for (let wa of wordsA) {
      for (let wb of wordsB) {
        if (wb === wa || wa.includes(wb) || wb.includes(wa) || 
            (wa.length > 4 && wb.length > 4 && wa[0] === wb[0] && wa[wa.length-1] === wb[wb.length-1])) {
          matches++;
          break;
        }
      }
    }
    return matches / Math.max(wordsA.length, wordsB.length);
  }

  // Reconnaissance vocale
  function startListening() {
    if (!window.webkitSpeechRecognition && !window.SpeechRecognition) {
      showFeedback("Reconnaissance vocale non supportée. Utilisez Chrome sur Android", "error");
      return;
    }
    
    const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecog();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      voiceStatus.innerHTML = '🎤🔴 Écoute... Parlez';
      voiceStatus.className = 'status listening';
      startVisualization();
      micStatus.innerHTML = '🎤 Micro actif - Parlez maintenant';
      micStatus.className = 'mic-status';
    };

    recognition.onresult = (event) => {
      let transcript = event.results[0][0].transcript;
      evaluate(transcript);
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') {
        micStatus.innerHTML = '🎤❌ Micro non autorisé. Vérifiez les permissions';
        micStatus.className = 'mic-status error';
        showFeedback("Autorisez l'accès au microphone dans les paramètres", "error");
      } else if (event.error === 'no-speech') {
        showFeedback("Aucun son détecté. Parlez plus fort", "warning");
      } else {
        showFeedback(`Erreur: ${event.error}. Réessayez`, "error");
      }
      stopListening();
    };

    recognition.onend = () => {
      stopListening();
      voiceStatus.innerHTML = '⚪ Prêt';
      voiceStatus.className = '';
    };

    try {
      recognition.start();
      setTimeout(() => {
        if (recognition && isListening) {
          try { recognition.stop(); } catch(e) {}
        }
      }, 8000);
    } catch(e) {
      showFeedback("Appuyez à nouveau sur Parler", "warning");
    }
  }

  function stopListening() {
    isListening = false;
    stopVisualization();
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
  }

  function evaluate(spoken) {
    const target = sentences[currentIndex];
    const sim = calculateSimilarity(spoken, target);
    const percent = Math.round(sim * 100);
    
    voiceStatus.innerHTML = `🎤✅ ${percent}%`;
    
    if (sim >= 0.65) {
      showFeedback(`✅ Excellent ! ${percent}% - "${spoken.substring(0, 50)}"`, 'success');
      const validated = markCurrentDone();
      if (validated && currentIndex + 1 < sentences.length) {
        setTimeout(() => {
          currentIndex++;
          saveProgress();
          updateUI();
          showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
        }, 2000);
      } else if (validated && currentIndex + 1 >= sentences.length) {
        setTimeout(() => showFeedback("🏆 Félicitations ! Texte terminé !", "success"), 1500);
      }
    } else if (sim >= 0.45) {
      showFeedback(`👍 ${percent}% - "${spoken.substring(0, 50)}" → encore un effort`, 'warning');
    } else {
      showFeedback(`📚 ${percent}% - Réécoutez et réessayez`, 'error');
    }
  }

  function repeatSequence() {
    showFeedback("🔊 Écoutez...", "info");
    speak(sentences[currentIndex], () => {
      playBeep();
      showFeedback("🎤 Parlez maintenant", "warning");
      setTimeout(() => {
        startListening();
      }, 300);
    });
  }

  function nextSegment() {
    if (progress[currentIndex]) {
      if (currentIndex + 1 < sentences.length) {
        currentIndex++;
        saveProgress();
        updateUI();
        showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
      } else {
        showFeedback("🎉 Texte terminé !", "success");
      }
    } else {
      showFeedback("⚠️ Validez d'abord cette phrase", "warning");
    }
  }

  function resetProgress() {
    if (confirm("Réinitialiser la progression ?")) {
      progress = new Array(sentences.length).fill(false);
      currentIndex = 0;
      saveProgress();
      updateUI();
      showFeedback("Progression réinitialisée", "info");
    }
  }

  function loadText(textId) {
    currentTextId = textId;
    const data = textsData[textId];
    sentences = splitIntoSentences(data.fullText, 100);
    textHeader.innerHTML = `<h3>📖 ${data.title}</h3>`;
    loadProgress();
    resizeCanvas();
    homeScreen.style.display = 'none';
    practiceScreen.style.display = 'block';
    if (recognition) try { recognition.stop(); } catch(e) {}
  }

  function buildHomeScreen() {
    textGrid.innerHTML = '';
    for (let [id, data] of Object.entries(textsData)) {
      let card = document.createElement('div');
      card.className = 'text-card';
      card.innerHTML = `<h3>${data.title}</h3><p>Cliquez pour commencer</p>`;
      card.onclick = () => loadText(id);
      textGrid.appendChild(card);
    }
  }

  // Événements
  playBtn.onclick = playCurrent;
  repeatBtn.onclick = repeatSequence;
  nextBtn.onclick = nextSegment;
  resetBtn.onclick = resetProgress;
  backToHomeBtn.onclick = () => {
    homeScreen.style.display = 'block';
    practiceScreen.style.display = 'none';
  };

  buildHomeScreen();
  resizeCanvas();
</script>
</body>
</html>
