<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>AI Voice Coach - English Pronunciation Trainer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui, -apple-system, 'Segoe UI', Roboto;background:linear-gradient(135deg, #eef5f2 0%, #d4e4df 100%);padding:20px;min-height:100vh;}
  .container{max-width:1000px;margin:0 auto;}
  
  .header{background:linear-gradient(135deg, #0d6e6e, #0a5555);color:white;padding:20px 25px;border-radius:28px;margin-bottom:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
  .header h1{font-size:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
  .badge{background:rgba(255,255,255,0.2);padding:5px 12px;border-radius:40px;font-size:0.8rem;}
  
  .home-screen{background:white;border-radius:28px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.1);}
  .home-screen h2{color:#0d6e6e;margin-bottom:20px;text-align:center;}
  .text-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;margin-top:20px;}
  .text-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:20px;padding:18px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
  .text-card:hover{transform:translateY(-5px);border-color:#0d6e6e;background:#e6f4f1;box-shadow:0 10px 20px rgba(0,0,0,0.1);}
  .text-card h3{color:#0d6e6e;margin-bottom:8px;font-size:1.1rem;}
  .text-card p{font-size:0.85rem;color:#64748b;}
  
  .practice-screen{display:none;}
  .back-btn{background:#e2e8f0;color:#1e293b;margin-bottom:15px;}
  .back-btn:hover{background:#cbd5e1;transform:translateY(-2px);}
  
  .card{background:white;border-radius:28px;padding:24px;margin-bottom:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);}
  .text-header{color:#0d6e6e;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e2e8f0;}
  .sentence-box{background:linear-gradient(135deg, #e6f4f1, #d0ebe6);border-left:5px solid #0d6e6e;padding:25px;border-radius:18px;margin-bottom:20px;}
  .sentence-text{font-size:1.25rem;font-weight:500;line-height:1.5;color:#1a2e2a;}
  .controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;justify-content:center;}
  button{background:#0d6e6e;border:none;padding:12px 24px;border-radius:60px;color:white;font-weight:600;cursor:pointer;transition:all 0.2s ease;display:inline-flex;align-items:center;gap:8px;font-size:0.95rem;}
  button:hover{background:#0a5555;transform:translateY(-2px);box-shadow:0 5px 15px rgba(13,110,110,0.3);}
  button.outline{background:transparent;border:2px solid #0d6e6e;color:#0d6e6e;}
  button.outline:hover{background:#e6f4f1;}
  button.danger{background:#e74c3c;}
  button.danger:hover{background:#c0392b;}
  button.success{background:#27ae60;}
  button:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
  
  /* Visualiseur avancé */
  .visualizer{background:#1a1a2e;border-radius:24px;padding:20px;margin:20px 0;text-align:center;}
  canvas{width:100%;height:120px;background:#0f0f1a;border-radius:20px;display:block;}
  .status{margin-top:12px;font-weight:600;font-size:1rem;}
  .status.listening{color:#e74c3c;animation:pulse 1s infinite;}
  .status.success{color:#27ae60;}
  .status.processing{color:#f5a623;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
  
  .progress-bar{height:12px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin:15px 0;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#0d6e6e,#f5a623,#27ae60);width:0%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
  .progress-stats{display:flex;justify-content:space-between;font-size:0.85rem;margin-top:8px;}
  
  .feedback{margin-top:15px;padding:16px;border-radius:20px;transition:all 0.3s;}
  .feedback-success{background:linear-gradient(135deg,#d4edda,#c8e6d9);border-left:5px solid #27ae60;color:#155724;}
  .feedback-error{background:linear-gradient(135deg,#f8d7da,#ffebee);border-left:5px solid #e74c3c;color:#721c24;}
  .feedback-warning{background:linear-gradient(135deg,#fff3cd,#ffeaa7);border-left:5px solid #f5a623;color:#856404;}
  .feedback-info{background:linear-gradient(135deg,#d1ecf1,#bee0eb);border-left:5px solid #0d6e6e;color:#0c5460;}
  
  .score-circle{display:inline-block;width:60px;height:60px;border-radius:50%;background:#1a1a2e;color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;margin-right:15px;}
  
  .word-highlight{background:#f5a623;color:white;padding:2px 6px;border-radius:12px;font-size:0.8rem;margin-left:8px;}
  
  .perm-alert{background:#fff3cd;border-radius:20px;padding:12px;margin-bottom:15px;display:none;}
  .perm-alert.show{display:flex;justify-content:space-between;align-items:center;}
  
  @media(max-width:600px){.sentence-text{font-size:1rem;}.controls button{padding:8px 16px;font-size:0.85rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎤 AI Voice Coach <span class="badge">Advanced Pronunciation</span></h1>
    <p>Écoute, répète, l'IA analyse et corrige ta prononciation en temps réel</p>
  </div>

  <div id="homeScreen" class="home-screen">
    <h2>📚 Choisissez un texte</h2>
    <div class="text-grid" id="textGrid"></div>
  </div>

  <div id="practiceScreen" class="practice-screen">
    <button id="backToHomeBtn" class="back-btn">← Retour aux textes</button>
    <div class="card">
      <div id="textHeader" class="text-header"></div>
      <div class="controls">
        <button id="playBtn">🔊 Écouter</button>
        <button id="repeatBtn" style="background:#f5a623;">🎤 IA Écoute & Analyse</button>
        <button id="nextBtn" class="outline" disabled>⏩ Suivant</button>
        <button id="resetBtn" class="danger">🔄 Reset</button>
      </div>

      <div class="sentence-box">
        <div class="sentence-text" id="sentenceText">Chargement...</div>
      </div>

      <div id="permAlert" class="perm-alert">
        <span>🎤 Autorisez le microphone pour l'analyse IA</span>
        <button id="requestMicBtn" style="background:#f5a623; padding:6px 12px;">Autoriser</button>
      </div>

      <div class="visualizer">
        <canvas id="voiceCanvas" width="800" height="120"></canvas>
        <div class="status" id="voiceStatus">🎤 En attente</div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-stats">
        <span>📊 Progression</span>
        <span id="progressText">0%</span>
      </div>

      <div id="feedback" class="feedback feedback-info">💡 Cliquez sur "IA Écoute & Analyse" pour commencer</div>
    </div>
  </div>
</div>

<script>
  // ========== TEXTES ==========
  const textsData = {

  // ========== Découpage intelligent ==========
  function splitSentences(text, maxLen=100) {
    let sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    let segments = [];
    for (let s of sentences) {
      s = s.trim().replace(/\s+/g, ' ');
      if (s.length === 0) continue;
      if (s.length <= maxLen) {
        segments.push(s);
      } else {
        let parts = s.split(/[,;:]/);
        let current = '';
        for (let part of parts) {
          part = part.trim();
          if (current.length + part.length + 2 <= maxLen) {
            current = current ? current + ', ' + part : part;
          } else {
            if (current) segments.push(current + '.');
            current = part;
          }
        }
        if (current) segments.push(current + '.');
      }
    }
    return segments;
  }

  let currentTextId = null;
  let segments = [];
  let currentIndex = 0;
  let progress = [];
  
  // Audio variables
  let mediaStream = null;
  let audioContext = null;
  let analyser = null;
  let animationId = null;
  let isRecording = false;
  let recognition = null;
  let isWaitingForNext = false;

  // DOM
  const homeScreen = document.getElementById('homeScreen');
  const practiceScreen = document.getElementById('practiceScreen');
  const textGrid = document.getElementById('textGrid');
  const backToHomeBtn = document.getElementById('backToHomeBtn');
  const textHeader = document.getElementById('textHeader');
  const sentenceEl = document.getElementById('sentenceText');
  const playBtn = document.getElementById('playBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resetBtn = document.getElementById('resetBtn');
  const requestMicBtn = document.getElementById('requestMicBtn');
  const permAlert = document.getElementById('permAlert');
  const voiceStatus = document.getElementById('voiceStatus');
  const feedbackDiv = document.getElementById('feedback');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const canvas = document.getElementById('voiceCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    if (canvas.parentElement) {
      canvas.width = canvas.parentElement.clientWidth - 40;
      canvas.height = 120;
    }
  }
  window.addEventListener('resize', resizeCanvas);
  
  // Progression
  function getStorageKey() { return `pronunciation_progress_${currentTextId}`; }
  
  function loadProgress() {
    let saved = localStorage.getItem(getStorageKey());
    if (saved) {
      progress = JSON.parse(saved);
      if (progress.length > segments.length) progress = progress.slice(0, segments.length);
      while (progress.length < segments.length) progress.push(false);
    } else {
      progress = new Array(segments.length).fill(false);
    }
    currentIndex = 0;
    updateProgressUI();
    sentenceEl.innerText = segments[currentIndex];
    updateNextButton();
  }
  
  function saveProgress() {
    localStorage.setItem(getStorageKey(), JSON.stringify(progress));
    updateProgressUI();
  }
  
  function updateProgressUI() {
    let done = progress.filter(v=>v===true).length;
    let percent = Math.round((done/segments.length)*100);
    progressFill.style.width = percent+'%';
    progressText.innerText = `${done}/${segments.length} (${percent}%)`;
  }
  
  function updateNextButton() {
    nextBtn.disabled = !progress[currentIndex];
    if (progress[currentIndex]) nextBtn.classList.add('success');
    else nextBtn.classList.remove('success');
  }
  
  function markCurrentDone() {
    if (!progress[currentIndex]) {
      progress[currentIndex] = true;
      saveProgress();
      updateNextButton();
      showFeedback(`✅ Parfait ! Phrase ${currentIndex+1} validée !`, 'success');
      return true;
    }
    return false;
  }

  function showFeedback(msg, type='info', score=null) {
    let className = '';
    if (type === 'success') className = 'feedback-success';
    else if (type === 'error') className = 'feedback-error';
    else if (type === 'warning') className = 'feedback-warning';
    else className = 'feedback-info';
    
    if (score !== null) {
      feedbackDiv.innerHTML = `<div style="display:flex;align-items:center;"><div class="score-circle" style="background:${score>=70?'#27ae60':score>=50?'#f5a623':'#e74c3c'}">${score}%</div><div>${msg}</div></div>`;
    } else {
      feedbackDiv.innerHTML = msg;
    }
    feedbackDiv.className = `feedback ${className}`;
    setTimeout(() => {
      if (feedbackDiv.innerHTML === msg || feedbackDiv.innerHTML.includes(msg)) {
        feedbackDiv.innerHTML = '💡 Cliquez sur "IA Écoute & Analyse" pour continuer';
        feedbackDiv.className = 'feedback feedback-info';
      }
    }, 5000);
  }

  // Synthèse vocale
  function speak(text, callback) {
    if (!window.speechSynthesis) return;
    let utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    utter.pitch = 1;
    utter.onend = () => { if(callback) callback(); };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function playCurrent() {
    speak(segments[currentIndex]);
    showFeedback(`🔊 Écoute - Phrase ${currentIndex+1}/${segments.length}`, 'info');
  }

  function playBeep() {
    try {
      let ctxBeep = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ctxBeep.createOscillator();
      let gain = ctxBeep.createGain();
      osc.connect(gain);
      gain.connect(ctxBeep.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.25;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctxBeep.currentTime + 0.4);
      osc.stop(ctxBeep.currentTime + 0.4);
      setTimeout(() => ctxBeep.close(), 500);
    } catch(e) {}
  }

  // Microphone
  async function initMicrophone() {
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioContext) await audioContext.close();
    try {
      let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaStream = stream;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      let source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      await audioContext.resume();
      permAlert.classList.remove('show');
      return true;
    } catch(err) {
      permAlert.classList.add('show');
      showFeedback('❌ Activez le microphone dans les paramètres', 'error');
      return false;
    }
  }

  // Visualisation avancée avec analyse d'amplitude
  function startVisualization() {
    if (animationId) cancelAnimationFrame(animationId);
    if (!analyser) return;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    let lastAmplitude = 0;
    
    function draw() {
      if (!isRecording || !analyser) {
        if (animationId) cancelAnimationFrame(animationId);
        return;
      }
      analyser.getByteTimeDomainData(dataArray);
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      let sliceWidth = canvas.width / bufferLength;
      let x = 0;
      ctx.beginPath();
      let maxAmp = 0;
      for (let i = 0; i < bufferLength; i++) {
        let v = dataArray[i] / 128.0;
        let amplitude = Math.abs(v - 1);
        if (amplitude > maxAmp) maxAmp = amplitude;
        let y = (v * canvas.height) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.strokeStyle = maxAmp > 0.15 ? '#e74c3c' : maxAmp > 0.05 ? '#f5a623' : '#0d6e6e';
      ctx.lineWidth = 3;
      ctx.stroke();
      animationId = requestAnimationFrame(draw);
    }
    draw();
  }

  function stopVisualization() {
    isRecording = false;
    if (animationId) cancelAnimationFrame(animationId);
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // ========== ALGORITHME DE SIMILARITÉ AVANCÉ ==========
  function advancedSimilarity(spoken, target) {
    let spokenNorm = spoken.toLowerCase().replace(/[^\w\s]/g, '').trim();
    let targetNorm = target.toLowerCase().replace(/[^\w\s]/g, '').trim();
    
    if (spokenNorm === targetNorm) return 1;
    if (spokenNorm.length === 0 || targetNorm.length === 0) return 0;
    
    let spokenWords = spokenNorm.split(/\s+/);
    let targetWords = targetNorm.split(/\s+/);
    
    // Calcul du score par mot avec pondération
    let totalScore = 0;
    let maxPossible = targetWords.length;
    
    for (let i = 0; i < targetWords.length; i++) {
      let targetWord = targetWords[i];
      let bestMatch = 0;
      
      for (let j = 0; j < spokenWords.length; j++) {
        let spokenWord = spokenWords[j];
        
        // Exact match
        if (spokenWord === targetWord) {
          bestMatch = 1;
          break;
        }
        // Contains or starts with
        if (spokenWord.includes(targetWord) || targetWord.includes(spokenWord)) {
          bestMatch = Math.max(bestMatch, 0.85);
        }
        // Levenshtein pour mots similaires
        else {
          let len = Math.max(spokenWord.length, targetWord.length);
          let dist = levenshteinDistance(spokenWord, targetWord);
          let sim = 1 - (dist / len);
          bestMatch = Math.max(bestMatch, sim * 0.8);
        }
      }
      totalScore += bestMatch;
    }
    
    // Bonus pour l'ordre approximatif des mots
    let orderBonus = 0;
    for (let i = 0; i < Math.min(spokenWords.length, targetWords.length); i++) {
      if (spokenWords[i] === targetWords[i]) orderBonus += 0.05;
    }
    
    let finalScore = (totalScore / maxPossible) + Math.min(orderBonus, 0.2);
    return Math.min(finalScore, 1);
  }
  
  function levenshteinDistance(a, b) {
    const matrix = Array(b.length + 1).fill().map(() => Array(a.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
    for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
    for (let j = 1; j <= b.length; j++) {
      for (let i = 1; i <= a.length; i++) {
        const cost = a[i-1] === b[j-1] ? 0 : 1;
        matrix[j][i] = Math.min(
          matrix[j][i-1] + 1,
          matrix[j-1][i] + 1,
          matrix[j-1][i-1] + cost
        );
      }
    }
    return matrix[b.length][a.length];
  }

  // Reconnaissance vocale avancée
  function startSpeechRecognition() {
    if (!window.webkitSpeechRecognition && !window.SpeechRecognition) {
      showFeedback("❌ Utilisez Chrome ou Edge pour la reconnaissance vocale", "error");
      return false;
    }
    const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecog();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;
    recognition.continuous = false;

    recognition.onstart = () => {
      isRecording = true;
      voiceStatus.innerHTML = '🎤🔴 IA en écoute... Parlez clairement';
      voiceStatus.className = 'status listening';
      startVisualization();
    };

    recognition.onresult = (event) => {
      let bestTranscript = '';
      let bestConfidence = 0;
      
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          for (let j = 0; j < event.results[i].length; j++) {
            if (event.results[i][j].confidence > bestConfidence) {
              bestConfidence = event.results[i][j].confidence;
              bestTranscript = event.results[i][j].transcript;
            }
          }
        }
      }
      
      if (bestTranscript) {
        evaluateAdvanced(bestTranscript);
      } else if (event.results[0][0]) {
        evaluateAdvanced(event.results[0][0].transcript);
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') {
        permAlert.classList.add('show');
        showFeedback("❌ Autorisez le microphone", "error");
      } else if (event.error === 'no-speech') {
        showFeedback("🎤 Aucun son détecté. Parlez plus fort", "warning");
        voiceStatus.innerHTML = '🎤 En attente';
        voiceStatus.className = '';
      } else {
        showFeedback(`❌ Erreur: ${event.error}. Réessayez`, "error");
      }
      stopListening();
    };

    recognition.onend = () => {
      stopListening();
      if (!isWaitingForNext) {
        voiceStatus.innerHTML = '🎤 Prêt';
        voiceStatus.className = '';
      }
    };

    try {
      recognition.start();
      return true;
    } catch(e) {
      showFeedback("Erreur de démarrage", "error");
      return false;
    }
  }

  function stopListening() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    isRecording = false;
    stopVisualization();
  }

  function evaluateAdvanced(spoken) {
    const target = segments[currentIndex];
    const similarity = advancedSimilarity(spoken, target);
    const percent = Math.round(similarity * 100);
    
    voiceStatus.innerHTML = `🎤✅ Analyse: ${percent}% de correspondance`;
    voiceStatus.className = 'status success';
    
    let message = '';
    let type = '';
    
    if (similarity >= 0.78) {
      message = `Excellent ! ${percent}% - Prononciation très proche du modèle`;
      type = 'success';
      const validated = markCurrentDone();
      
      if (validated && currentIndex + 1 < segments.length) {
        setTimeout(() => {
          currentIndex++;
          saveProgress();
          sentenceEl.innerText = segments[currentIndex];
          updateNextButton();
          showFeedback(`📖 Phrase ${currentIndex+1}/${segments.length}`, 'info');
        }, 2000);
      } else if (validated && currentIndex + 1 >= segments.length) {
        setTimeout(() => showFeedback("🏆 Félicitations ! Texte terminé !", "success"), 1500);
      }
    } else if (similarity >= 0.6) {
      message = `Bon travail ! ${percent}% - Quelques mots à améliorer, réessayez`;
      type = 'warning';
    } else if (similarity >= 0.4) {
      message = `👍 ${percent}% - Écoutez bien et répétez plus lentement`;
      type = 'warning';
    } else {
      message = `📚 ${percent}% - Réécoutez la phrase et répétez mot par mot`;
      type = 'error';
    }
    
    showFeedback(`${message}\n🗣️ Vous avez dit: "${spoken.substring(0, 100)}${spoken.length > 100 ? '...' : ''}"`, type, percent);
    
    setTimeout(() => {
      if (voiceStatus.innerHTML.includes(percent)) {
        voiceStatus.innerHTML = '🎤 Prêt';
        voiceStatus.className = '';
      }
    }, 3000);
  }

  async function fullRepeatSequence() {
    if (isWaitingForNext) return;
    isWaitingForNext = true;
    
    if (!mediaStream) {
      let ok = await initMicrophone();
      if (!ok) { isWaitingForNext = false; return; }
    }
    
    showFeedback("🔊 Écoute du modèle...", "info");
    speak(segments[currentIndex], () => {
      playBeep();
      showFeedback("🎤 Après le bip, répétez la phrase", "warning");
      setTimeout(() => {
        startSpeechRecognition();
        setTimeout(() => { isWaitingForNext = false; }, 5000);
      }, 400);
    });
  }

  function nextSegment() {
    if (progress[currentIndex]) {
      if (currentIndex + 1 < segments.length) {
        currentIndex++;
        saveProgress();
        sentenceEl.innerText = segments[currentIndex];
        updateNextButton();
        showFeedback(`📖 Phrase ${currentIndex+1}/${segments.length}`, 'info');
      } else {
        showFeedback("🎉 Texte terminé ! Félicitations !", "success");
      }
    } else {
      showFeedback("⚠️ Validez d'abord cette phrase avec l'IA", "warning");
    }
  }

  function resetAll() {
    if (confirm("Réinitialiser toute progression ?")) {
      progress = new Array(segments.length).fill(false);
      currentIndex = 0;
      saveProgress();
      sentenceEl.innerText = segments[currentIndex];
      updateNextButton();
      showFeedback("Progression réinitialisée", "info");
    }
  }

  function loadText(textId) {
    currentTextId = textId;
    const textData = textsData[textId];
    segments = splitSentences(textData.fullText, 100);
    textHeader.innerHTML = `<h3>📖 ${textData.title}</h3>`;
    loadProgress();
    resizeCanvas();
    homeScreen.style.display = 'none';
    practiceScreen.style.display = 'block';
    if (recognition) try { recognition.stop(); } catch(e) {}
    isRecording = false;
    stopVisualization();
    isWaitingForNext = false;
  }

  function buildHomeScreen() {
    textGrid.innerHTML = '';
    for (let [id, data] of Object.entries(textsData)) {
      const card = document.createElement('div');
      card.className = 'text-card';
      card.innerHTML = `<h3>${data.title}</h3><p>${data.shortDesc}</p><span style="font-size:0.7rem;color:#0d6e6e;">🎤 Entraînement IA</span>`;
      card.addEventListener('click', () => loadText(id));
      textGrid.appendChild(card);
    }
  }

  playBtn.addEventListener('click', playCurrent);
  repeatBtn.addEventListener('click', fullRepeatSequence);
  nextBtn.addEventListener('click', nextSegment);
  resetBtn.addEventListener('click', resetAll);
  requestMicBtn.addEventListener('click', async () => { await initMicrophone(); });
  backToHomeBtn.addEventListener('click', () => {
    homeScreen.style.display = 'block';
    practiceScreen.style.display = 'none';
    if (recognition) try { recognition.stop(); } catch(e) {}
    stopVisualization();
    isWaitingForNext = false;
  });

  document.addEventListener('keydown', (e) => {
    if (practiceScreen.style.display !== 'block') return;
    if (e.code === 'Space') { e.preventDefault(); playCurrent(); }
    if (e.code === 'KeyR') { e.preventDefault(); fullRepeatSequence(); }
    if (e.code === 'KeyN') { e.preventDefault(); nextSegment(); }
  });

  buildHomeScreen();
  resizeCanvas();
  initMicrophone().catch(() => {});
</script>
</body>
</html>
