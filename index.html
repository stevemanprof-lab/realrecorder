  // ========== DÉCOUPAGE EN PHRASES COURTES (max 60 caractères) ==========
  function splitIntoSentences(text, maxLen=60) {
    let clean = text.replace(/\s+/g, ' ').trim();
    let sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
    let result = [];
    for (let s of sentences) {
      s = s.trim();
      if (s.length === 0) continue;
      if (s.length <= maxLen) {
        result.push(s);
      } else {
        let parts = s.split(/[,;:]/);
        let current = '';
        for (let p of parts) {
          p = p.trim();
          if (current.length + p.length + 2 <= maxLen) {
            current = current ? current + ', ' + p : p;
          } else {
            if (current) {
              if (!current.endsWith('.')) current += '.';
              result.push(current);
            }
            current = p;
          }
        }
        if (current) {
          if (!current.endsWith('.')) current += '.';
          result.push(current);
        }
      }
    }
    return result.filter(s => s.length > 10 && s.match(/[a-zA-Z]/));
  }

  function resizeCanvas() {
    canvas.width = Math.min(canvas.parentElement.clientWidth - 30, 400);
    canvas.height = 60;
  }
  window.addEventListener('resize', resizeCanvas);

  function getStorageKey() { return `voice_progress_${currentTextId}`; }
  
  function loadProgress() {
    let saved = localStorage.getItem(getStorageKey());
    if (saved) {
      progress = JSON.parse(saved);
      if (progress.length > sentences.length) progress = progress.slice(0, sentences.length);
      while (progress.length < sentences.length) progress.push(false);
    } else {
      progress = new Array(sentences.length).fill(false);
    }
    currentIndex = 0;
    updateUI();
  }
  
  function saveProgress() {
    localStorage.setItem(getStorageKey(), JSON.stringify(progress));
    updateUI();
  }
  
  function updateUI() {
    if (sentences.length === 0) return;
    let done = progress.filter(v=>v===true).length;
    let percent = Math.round((done/sentences.length)*100);
    progressFill.style.width = percent+'%';
    progressText.innerText = `${done}/${sentences.length} (${percent}%)`;
    if (sentences[currentIndex]) {
      sentenceEl.innerText = sentences[currentIndex];
    }
    nextBtn.disabled = !progress[currentIndex];
    if (progress[currentIndex]) nextBtn.classList.add('success');
    else nextBtn.classList.remove('success');
  }
  
  function markCurrentDone() {
    if (!progress[currentIndex]) {
      progress[currentIndex] = true;
      saveProgress();
      showFeedback(`✅ Phrase ${currentIndex+1} validée !`, 'success');
      return true;
    }
    return false;
  }

  function showFeedback(msg, type='info') {
    let className = '';
    if (type === 'success') className = 'feedback-success';
    else if (type === 'error') className = 'feedback-error';
    else if (type === 'warning') className = 'feedback-warning';
    else className = 'feedback-info';
    
    feedbackDiv.innerHTML = msg;
    feedbackDiv.className = `feedback ${className}`;
  }

  function speak(text, onEnd) {
    if (!window.speechSynthesis) {
      showFeedback("Lecture non disponible", "error");
      return;
    }
    try {
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.8;
      utterance.onend = () => { 
        if (typeof onEnd === 'function') onEnd(); 
      };
      utterance.onerror = () => {
        if (typeof onEnd === 'function') onEnd();
      };
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    } catch(e) {
      console.error("Speech error:", e);
      showFeedback("Erreur de lecture", "error");
      if (typeof onEnd === 'function') onEnd();
    }
  }

  function playCurrent() {
    if (!sentences[currentIndex]) return;
    speak(sentences[currentIndex]);
    showFeedback(`🔊 Écoute - ${currentIndex+1}/${sentences.length}`, 'info');
  }

  function playBeep() {
    try {
      let ac = new (window.AudioContext || window.webkitAudioContext)();
      let osc = ac.createOscillator();
      let gain = ac.createGain();
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.frequency.value = 880;
      gain.gain.value = 0.1;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + 0.3);
      osc.stop(ac.currentTime + 0.3);
      setTimeout(() => ac.close(), 400);
    } catch(e) { console.log("Beep skipped"); }
  }

  function startVisualization() {
    if (animationId) cancelAnimationFrame(animationId);
    let time = 0;
    function draw() {
      if (!isListening) {
        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.strokeStyle = '#0d6e6e';
      ctx.lineWidth = 2;
      let amp = 15 + Math.sin(time * 0.5) * 5;
      for (let x = 0; x < canvas.width; x += 5) {
        let y = canvas.height/2 + Math.sin(x * 0.04 + time) * amp;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      time += 0.1;
      animationId = requestAnimationFrame(draw);
    }
    draw();
  }

  function stopVisualization() {
    isListening = false;
    if (animationId) cancelAnimationFrame(animationId);
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function calculateSimilarity(spoken, target) {
    let a = spoken.toLowerCase().replace(/[^\w\s]/g, '').trim();
    let b = target.toLowerCase().replace(/[^\w\s]/g, '').trim();
    if (a === b) return 1;
    if (a.length === 0 || b.length === 0) return 0;
    
    let wordsA = a.split(/\s+/);
    let wordsB = b.split(/\s+/);
    
    let lengthDiff = Math.abs(wordsA.length - wordsB.length);
    let lengthPenalty = Math.max(0, 1 - (lengthDiff / Math.max(wordsA.length, wordsB.length)));
    
    let matches = 0;
    for (let wa of wordsA) {
      let bestMatch = 0;
      for (let wb of wordsB) {
        if (wb === wa) { bestMatch = 1; break; }
        if (wa.includes(wb) && wa.length > 3) bestMatch = Math.max(bestMatch, 0.85);
        if (wb.includes(wa) && wb.length > 3) bestMatch = Math.max(bestMatch, 0.85);
        if (wa.length > 4 && wb.length > 4) {
          if (wa[0] === wb[0] && wa[wa.length-1] === wb[wb.length-1]) {
            bestMatch = Math.max(bestMatch, 0.6);
          }
        }
      }
      matches += bestMatch;
    }
    
    let ratio = (matches / Math.max(wordsA.length, wordsB.length)) * lengthPenalty;
    return Math.min(ratio + 0.1, 1);
  }

  function startListening() {
    const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecog) {
      showFeedback("Reconnaissance vocale non supportée", "error");
      compatWarning.classList.add('show');
      return;
    }
    
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
      recognition = null;
    }
    
    recognition = new SpeechRecog();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    recognition.onstart = () => {
      isListening = true;
      voiceStatus.innerHTML = '🎤🔴 Écoute...';
      voiceStatus.className = 'status listening';
      repeatBtn.textContent = '⏹️ Arrêter';
      repeatBtn.style.background = '#e74c3c';
      startVisualization();
      micStatus.innerHTML = '🎤 Parlez maintenant...';
      micStatus.className = 'mic-status';
    };

    recognition.onresult = (event) => {
      let transcript = event.results[0][0].transcript;
      evaluate(transcript);
    };

    recognition.onerror = (event) => {
      if (event.error === 'not-allowed') {
        micStatus.innerHTML = '🎤❌ Micro non autorisé';
        micStatus.className = 'mic-status error';
        showFeedback("Autorisez l'accès au microphone", "error");
      } else if (event.error === 'no-speech') {
        showFeedback("Aucun son détecté. Parlez plus fort", "warning");
      } else if (event.error === 'audio-capture') {
        showFeedback("Microphone non trouvé", "error");
      } else {
        showFeedback(`Erreur: ${event.error}`, "error");
      }
      stopListening();
    };

    recognition.onend = () => {
      stopListening();
      voiceStatus.innerHTML = '⚪ Prêt';
      voiceStatus.className = '';
      repeatBtn.textContent = '🎤 Parler';
      repeatBtn.style.background = '#f5a623';
    };

    try {
      recognition.start();
      setTimeout(() => {
        if (recognition && isListening) {
          try { recognition.stop(); } catch(e) {}
        }
      }, 15000);
    } catch(e) {
      showFeedback("Appuyez à nouveau sur Parler", "warning");
      repeatBtn.textContent = '🎤 Parler';
      repeatBtn.style.background = '#f5a623';
    }
  }

  function stopListening() {
    isListening = false;
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
      recognition = null;
    }
    stopVisualization();
    voiceStatus.innerHTML = '⚪ Prêt';
    voiceStatus.className = '';
    repeatBtn.textContent = '🎤 Parler';
    repeatBtn.style.background = '#f5a623';
  }

  function evaluate(spoken) {
    if (!sentences[currentIndex]) return;
    const target = sentences[currentIndex];
    const sim = calculateSimilarity(spoken, target);
    const percent = Math.round(sim * 100);
    
    voiceStatus.innerHTML = `🎤✅ ${percent}%`;
    voiceStatus.className = 'status success';
    
    if (sim >= 0.65) {
      showFeedback(`✅ Excellent ! ${percent}%`, 'success');
      const validated = markCurrentDone();
      if (validated && currentIndex + 1 < sentences.length) {
        setTimeout(() => {
          currentIndex++;
          saveProgress();
          updateUI();
          showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
        }, 2000);
      } else if (validated && currentIndex + 1 >= sentences.length) {
        setTimeout(() => showFeedback("🏆 Félicitations ! Texte terminé !", "success"), 1500);
      }
    } else if (sim >= 0.45) {
      showFeedback(`👍 ${percent}% - Encore un effort`, 'warning');
    } else {
      showFeedback(`📚 ${percent}% - Réécoutez et réessayez`, 'error');
    }
  }

  function repeatSequence() {
    if (isListening) {
      stopListening();
      return;
    }
    
    if (!sentences[currentIndex]) return;
    
    showFeedback("🔊 Écoutez...", "info");
    speak(sentences[currentIndex], () => {
      setTimeout(() => {
        playBeep();
        showFeedback("🎤 Parlez maintenant", "warning");
        setTimeout(() => {
          startListening();
        }, 300);
      }, 300);
    });
  }

  function nextSegment() {
    if (progress[currentIndex]) {
      if (currentIndex + 1 < sentences.length) {
        currentIndex++;
        saveProgress();
        updateUI();
        showFeedback(`📖 Phrase ${currentIndex+1}/${sentences.length}`, 'info');
      } else {
        showFeedback("🎉 Texte terminé !", "success");
      }
    } else {
      showFeedback("⚠️ Validez d'abord cette phrase", "warning");
    }
  }

  function resetProgress() {
    if (confirm("Réinitialiser la progression ?")) {
      progress = new Array(sentences.length).fill(false);
      currentIndex = 0;
      saveProgress();
      updateUI();
      showFeedback("Progression réinitialisée", "info");
    }
  }

  function loadText(textId) {
    currentTextId = textId;
    const data = textsData[textId];
    if (!data) return;
    sentences = splitIntoSentences(data.fullText, 60);
    if (sentences.length === 0) {
      sentences = [data.fullText.substring(0, 60) + '...'];
    }
    textHeader.innerHTML = `<h3>📖 ${data.title} (${sentences.length} phrases)</h3>`;
    loadProgress();
    resizeCanvas();
    homeScreen.style.display = 'none';
    practiceScreen.style.display = 'block';
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    stopListening();
  }

  function buildHomeScreen() {
    textGrid.innerHTML = '';
    for (let [id, data] of Object.entries(textsData)) {
      let card = document.createElement('div');
      card.className = 'text-card';
      card.innerHTML = `
        <h3>${data.title}</h3>
        <p>${data.tag || 'Lecture'}</p>
        <span class="text-tag">🎤 ${sentencesInText(data.fullText)} phrases</span>
      `;
      card.onclick = () => loadText(id);
      textGrid.appendChild(card);
    }
  }

  function sentencesInText(text) {
    let clean = text.replace(/\s+/g, ' ').trim();
    let sentences = clean.match(/[^.!?]+[.!?]+/g) || [text];
    return sentences.length;
  }

  // ========== ÉVÉNEMENTS ==========
  playBtn.onclick = playCurrent;
  repeatBtn.onclick = repeatSequence;
  nextBtn.onclick = nextSegment;
  resetBtn.onclick = resetProgress;
  backToHomeBtn.onclick = () => {
    homeScreen.style.display = 'block';
    practiceScreen.style.display = 'none';
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    stopListening();
  };

  document.addEventListener('keydown', (e) => {
    if (practiceScreen.style.display !== 'block') return;
    if (e.key === ' ' || e.key === 'Space') {
      e.preventDefault();
      playCurrent();
    }
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      repeatSequence();
    }
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      nextSegment();
    }
  });

  // ========== INITIALISATION ==========
  buildHomeScreen();
  resizeCanvas();
</script>
</body>
</html>
