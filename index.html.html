<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Audio Recorder - Partage complet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #0f172a;
            padding: 1.5rem 2rem;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .header p {
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .content {
            padding: 2rem;
        }

        .recorder-area {
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            border: 2px dashed #cbd5e1;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }

        .recorder-area.recording {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .timer {
            font-size: 3rem;
            font-family: monospace;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 1rem;
        }

        .status {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 1.5rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #0f172a;
            color: white;
        }

        .btn-primary:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: white;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .recordings-list {
            margin-top: 2rem;
        }

        .recordings-list h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .recording-item {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid #e2e8f0;
        }

        .audio-info {
            flex: 1;
            min-width: 150px;
        }

        .audio-info audio {
            width: 100%;
            margin-bottom: 0.5rem;
            border-radius: 2rem;
        }

        .audio-meta {
            font-size: 0.75rem;
            color: #64748b;
        }

        .share-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .share-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .share-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        /* Modal de partage */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 1.5rem;
            max-width: 350px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h4 {
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .share-options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .share-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }

        .share-option:hover {
            background: #f8fafc;
            border-color: #0c6b5e;
        }

        .close-modal {
            margin-top: 1rem;
            width: 100%;
            padding: 0.8rem;
            background: #e2e8f0;
            border: none;
            border-radius: 2rem;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 3rem;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1001;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .content {
                padding: 1.5rem;
            }
            .recording-item {
                flex-direction: column;
                align-items: stretch;
            }
            .share-buttons {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎙️ Audio Recorder</h1>
        <p>Enregistrez, écoutez et partagez facilement</p>
    </div>
    <div class="content">
        <div class="recorder-area" id="recorderArea">
            <div class="timer" id="timer">00:00</div>
            <div class="status" id="status">Prêt à enregistrer</div>
            <div class="button-group">
                <button class="btn btn-primary" id="recordBtn">🎤 Enregistrer</button>
                <button class="btn btn-danger" id="stopBtn" disabled>⏹️ Arrêter</button>
            </div>
        </div>

        <div class="recordings-list">
            <h3>📀 Mes enregistrements</h3>
            <div id="recordingsContainer">
                <div style="text-align: center; color: #94a3b8; padding: 2rem;">
                    Aucun enregistrement
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal de partage -->
<div id="shareModal" class="modal">
    <div class="modal-content">
        <h4>📤 Partager l'enregistrement</h4>
        <div class="share-options" id="shareOptions">
            <!-- Options générées dynamiquement -->
        </div>
        <button class="close-modal" onclick="closeShareModal()">Fermer</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ==================== CONFIGURATION ====================
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let startTime = null;
    let timerInterval = null;
    let stream = null;
    let currentShareBlob = null;
    let currentShareUrl = null;

    // Éléments DOM
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const recorderArea = document.getElementById('recorderArea');
    const recordingsContainer = document.getElementById('recordingsContainer');
    const toastEl = document.getElementById('toast');
    const shareModal = document.getElementById('shareModal');

    // ==================== INDEXEDDB ====================
    const DB_NAME = 'AudioRecorderDB';
    const STORE_NAME = 'recordings';
    let db = null;

    function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 2);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };
        });
    }

    async function saveRecording(blob, duration) {
        if (!db) await initDB();
        const id = Date.now();
        const recording = {
            id: id,
            blob: blob,
            date: new Date().toISOString(),
            duration: duration
        };
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.add(recording);
            request.onsuccess = () => resolve(id);
            request.onerror = () => reject(request.error);
        });
    }

    async function getAllRecordings() {
        if (!db) await initDB();
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    }

    async function deleteRecording(id) {
        if (!db) await initDB();
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    // ==================== UI ====================
    function formatDuration(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    async function renderRecordings() {
        const recordings = await getAllRecordings();
        if (recordings.length === 0) {
            recordingsContainer.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 2rem;">Aucun enregistrement</div>`;
            return;
        }

        recordings.sort((a, b) => new Date(b.date) - new Date(a.date));
        recordingsContainer.innerHTML = '';

        for (const rec of recordings) {
            const url = URL.createObjectURL(rec.blob);
            const item = document.createElement('div');
            item.className = 'recording-item';
            item.innerHTML = `
                <div class="audio-info">
                    <audio controls src="${url}"></audio>
                    <div class="audio-meta">📅 ${new Date(rec.date).toLocaleString()} • ⏱️ ${formatDuration(Math.floor(rec.duration))}</div>
                </div>
                <div class="share-buttons">
                    <button class="share-btn" data-action="share" data-id="${rec.id}">🔗 Partager</button>
                    <button class="share-btn" data-action="download" data-id="${rec.id}">💾 Télécharger</button>
                    <button class="share-btn" data-action="delete" data-id="${rec.id}">🗑️ Supprimer</button>
                </div>
            `;
            recordingsContainer.appendChild(item);
            // Libérer l'URL après le rendu
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // Événements
        document.querySelectorAll('[data-action="share"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = parseInt(btn.dataset.id);
                const recordings = await getAllRecordings();
                const rec = recordings.find(r => r.id === id);
                if (rec) openShareModal(rec.blob);
            });
        });

        document.querySelectorAll('[data-action="download"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = parseInt(btn.dataset.id);
                const recordings = await getAllRecordings();
                const rec = recordings.find(r => r.id === id);
                if (rec) {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(rec.blob);
                    a.download = `recording_${rec.id}.webm`;
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 100);
                    showToast('Téléchargement démarré');
                }
            });
        });

        document.querySelectorAll('[data-action="delete"]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = parseInt(btn.dataset.id);
                if (confirm('Supprimer cet enregistrement ?')) {
                    await deleteRecording(id);
                    showToast('Enregistrement supprimé');
                    renderRecordings();
                }
            });
        });
    }

    // ==================== MODAL DE PARTAGE AMÉLIORÉ ====================
    function openShareModal(blob) {
        currentShareBlob = blob;
        currentShareUrl = URL.createObjectURL(blob);
        
        const shareOptions = document.getElementById('shareOptions');
        shareOptions.innerHTML = '';

        // Option 1: API Web Share native (WhatsApp, Bluetooth, etc. selon le système)
        if (navigator.share) {
            const nativeBtn = document.createElement('div');
            nativeBtn.className = 'share-option';
            nativeBtn.innerHTML = '📱 Partager via l\'application native (WhatsApp, Bluetooth, etc.)';
            nativeBtn.onclick = () => {
                shareViaNative();
                closeShareModal();
            };
            shareOptions.appendChild(nativeBtn);
        }

        // Option 2: WhatsApp
        const whatsappBtn = document.createElement('div');
        whatsappBtn.className = 'share-option';
        whatsappBtn.innerHTML = '💬 WhatsApp';
        whatsappBtn.onclick = () => {
            shareViaWhatsApp();
            closeShareModal();
        };
        shareOptions.appendChild(whatsappBtn);

        // Option 3: Email
        const emailBtn = document.createElement('div');
        emailBtn.className = 'share-option';
        emailBtn.innerHTML = '📧 Email';
        emailBtn.onclick = () => {
            shareViaEmail();
            closeShareModal();
        };
        shareOptions.appendChild(emailBtn);

        // Option 4: Copier le lien
        const copyBtn = document.createElement('div');
        copyBtn.className = 'share-option';
        copyBtn.innerHTML = '🔗 Copier le lien';
        copyBtn.onclick = () => {
            shareViaCopy();
            closeShareModal();
        };
        shareOptions.appendChild(copyBtn);

        // Option 5: Télécharger (alternative)
        const downloadBtn = document.createElement('div');
        downloadBtn.className = 'share-option';
        downloadBtn.innerHTML = '💾 Télécharger le fichier';
        downloadBtn.onclick = () => {
            const a = document.createElement('a');
            a.href = currentShareUrl;
            a.download = `recording_${Date.now()}.webm`;
            a.click();
            showToast('Téléchargement démarré');
            closeShareModal();
        };
        shareOptions.appendChild(downloadBtn);

        shareModal.classList.add('show');
    }

    function closeShareModal() {
        shareModal.classList.remove('show');
        if (currentShareUrl) {
            URL.revokeObjectURL(currentShareUrl);
            currentShareUrl = null;
        }
        currentShareBlob = null;
    }

    async function shareViaNative() {
        if (!navigator.share) {
            showToast('Partage natif non disponible');
            return;
        }
        const file = new File([currentShareBlob], `recording_${Date.now()}.webm`, { type: 'audio/webm' });
        try {
            await navigator.share({
                title: 'Mon enregistrement audio',
                text: 'Écoutez mon message vocal !',
                files: [file]
            });
            showToast('✅ Partagé avec succès !');
        } catch (err) {
            if (err.name !== 'AbortError') {
                showToast('❌ Erreur lors du partage');
            }
        }
    }

    function shareViaWhatsApp() {
        // Créer un lien temporaire pour WhatsApp
        const tempUrl = currentShareUrl;
        // WhatsApp Web / Mobile
        const whatsappUrl = `https://wa.me/?text=🎙️ Écoutez mon enregistrement: ${encodeURIComponent(tempUrl)}`;
        window.open(whatsappUrl, '_blank');
        showToast('Ouverture de WhatsApp...');
    }

    function shareViaEmail() {
        const subject = encodeURIComponent('Mon enregistrement audio');
        const body = encodeURIComponent(`Écoutez mon enregistrement: ${currentShareUrl}`);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
        showToast('Ouverture de l\'email...');
    }

    async function shareViaCopy() {
        try {
            await navigator.clipboard.writeText(currentShareUrl);
            showToast('🔗 Lien copié ! Collez-le pour partager');
        } catch (err) {
            showToast('❌ Impossible de copier');
        }
    }

    // ==================== ENREGISTREMENT ====================
    async function startRecording() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
            mediaRecorder = new MediaRecorder(stream, { mimeType });
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const duration = (Date.now() - startTime) / 1000;
                await saveRecording(audioBlob, duration);
                showToast('✅ Enregistrement sauvegardé !');
                renderRecordings();
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
            };
            
            mediaRecorder.start(1000);
            isRecording = true;
            startTime = Date.now();
            startTimer();
            
            recordBtn.disabled = true;
            stopBtn.disabled = false;
            statusEl.textContent = '🔴 Enregistrement en cours...';
            recorderArea.classList.add('recording');
            
        } catch (err) {
            console.error(err);
            statusEl.textContent = '❌ Microphone inaccessible';
            showToast('⚠️ Autorisez l\'accès au microphone');
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && isRecording && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            isRecording = false;
            stopTimer();
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            statusEl.textContent = '✅ Enregistrement terminé';
            recorderArea.classList.remove('recording');
            setTimeout(() => {
                if (statusEl.textContent === '✅ Enregistrement terminé')
                    statusEl.textContent = 'Prêt à enregistrer';
            }, 2000);
        }
    }
    
    function startTimer() {
        timerInterval = setInterval(() => {
            if (startTime) {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
    }
    
    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerEl.textContent = '00:00';
    }
    
    // ==================== INITIALISATION ====================
    async function init() {
        await initDB();
        await renderRecordings();
        recordBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        
        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
        });
        
        // Fermer le modal en cliquant dehors
        shareModal.addEventListener('click', (e) => {
            if (e.target === shareModal) closeShareModal();
        });
    }
    
    init().catch(console.error);
</script>
</body>
</html>
