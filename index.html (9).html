<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Audio Recorder - Fiable avec son</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #0f172a;
            padding: 1.5rem 2rem;
            color: white;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; }
        .header p { color: #94a3b8; margin-top: 0.25rem; }
        .content { padding: 2rem; }
        .recorder-area {
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            border: 2px dashed #cbd5e1;
            transition: all 0.3s;
            margin-bottom: 2rem;
        }
        .recorder-area.recording {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .timer {
            font-size: 3rem;
            font-family: monospace;
            font-weight: 700;
            color: #0f172a;
        }
        .status {
            font-size: 0.9rem;
            color: #475569;
            margin: 0.5rem 0 1rem;
        }
        .visualizer {
            width: 100%;
            height: 60px;
            background: #1e293b;
            border-radius: 1rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #0f172a; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .recordings-list { margin-top: 2rem; }
        .recording-item {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .audio-info { flex: 1; min-width: 200px; }
        audio { width: 100%; }
        .share-buttons { display: flex; gap: 0.5rem; }
        .share-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>🎙️ Enregistreur Audio</h1>
        <p>Parlez dans le micro → écoutez → partagez</p>
    </div>

    <div class="content">
        <div class="recorder-area" id="recorderArea">
            <div class="timer" id="timer">00:00</div>
            <div class="status" id="status">Prêt</div>

            <div class="visualizer">
                <canvas id="visualizer" width="400" height="60"></canvas>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="recordBtn">🎤 Enregistrer</button>
                <button class="btn btn-danger" id="stopBtn" disabled>⏹️ Arrêter</button>
            </div>
        </div>

        <div class="recordings-list">
            <h3>📀 Mes enregistrements</h3>
            <div id="recordingsContainer"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const recordBtn = document.getElementById('recordBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');
const toastEl = document.getElementById('toast');

let mediaRecorder, mediaStream, audioChunks = [];
let audioContext, analyser, dataArray, animationId;
let isRecording = false;
let mimeType = "";

// TOAST
function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'),3000);
}

// GET MICRO
async function getMic(){
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter(d=>d.kind==="audioinput");
    console.log("🎤 Micros:", mics);

    return navigator.mediaDevices.getUserMedia({
        audio:{
            deviceId: mics[0]?.deviceId,
            channelCount:1,
            sampleRate:44100,
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
        }
    });
}

// VISUALIZER + VOLUME CHECK
async function initVisualizer(stream){
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);

    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    function draw(){
        if(!isRecording) return;

        analyser.getByteTimeDomainData(dataArray);

        let sum = 0;
        for(let i=0;i<dataArray.length;i++){
            sum += Math.abs(dataArray[i]-128);
        }
        let volume = sum/dataArray.length;

        if(volume < 1){
            statusEl.innerText = "⚠️ Aucun son détecté !";
        }

        ctx.fillStyle="#1e293b";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.beginPath();
        let x=0;
        let slice=canvas.width/dataArray.length;

        for(let i=0;i<dataArray.length;i++){
            let v=dataArray[i]/128;
            let y=v*canvas.height/2;
            i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            x+=slice;
        }
        ctx.strokeStyle="#10b981";
        ctx.stroke();

        animationId=requestAnimationFrame(draw);
    }
    draw();
}

// START
async function startRecording(){
    try{
        const stream = await getMic();
        mediaStream = stream;

        const types = [
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/ogg;codecs=opus'
        ];

        for(let t of types){
            if(MediaRecorder.isTypeSupported(t)){
                mimeType = t;
                break;
            }
        }

        mediaRecorder = new MediaRecorder(stream,{mimeType});
        audioChunks=[];

        mediaRecorder.ondataavailable=e=>{
            if(e.data.size>0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop=()=>{
            const blob=new Blob(audioChunks,{type:mimeType});
            if(blob.size<1000){
                showToast("❌ Enregistrement vide !");
                return;
            }

            const url=URL.createObjectURL(blob);

            const audio=document.createElement("audio");
            audio.controls=true;
            audio.src=url;

            const ext=mimeType.includes("ogg")?"ogg":"webm";

            const a=document.createElement("a");
            a.href=url;
            a.download="record."+ext;
            a.textContent="⬇ Télécharger";

            const div=document.createElement("div");
            div.className="recording-item";
            div.appendChild(audio);
            div.appendChild(a);

            document.getElementById("recordingsContainer").appendChild(div);

            mediaStream.getTracks().forEach(t=>t.stop());
        };

        mediaRecorder.start(1000);
        isRecording=true;

        statusEl.innerText="🔴 Enregistrement...";
        recordBtn.disabled=true;
        stopBtn.disabled=false;

        initVisualizer(stream);

    }catch(err){
        console.error(err);
        showToast("Erreur micro !");
    }
}

// STOP
function stopRecording(){
    if(mediaRecorder) mediaRecorder.stop();
    isRecording=false;
    recordBtn.disabled=false;
    stopBtn.disabled=true;
}

// EVENTS
recordBtn.onclick=startRecording;
stopBtn.onclick=stopRecording;
</script>
</body>
</html>
